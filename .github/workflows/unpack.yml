name: Unpack Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o HERO-FILE-EXTRACTOR-python.zip -d .
          echo "Extraction completed"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- HERO-FILE-EXTRACTOR-python.zip
          git diff --cached --quiet || git commit -m "Extract Python project files"
          git push
