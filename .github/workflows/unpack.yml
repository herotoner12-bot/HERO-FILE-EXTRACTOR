name: Unpack Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: unzip -o HERO-FILE-EXTRACTOR-python.zip -d .

      - name: Save files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- HERO-FILE-EXTRACTOR-python.zip
          git reset -- .github/workflows/extract.yml .github/workflows/tests.yml
          git diff --cached --quiet || git commit -m "Add Python extractor"
          git push
